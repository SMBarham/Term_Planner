<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
  <meta name="theme-color" content="#6d3aa8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Term Planner" />
  <title>Term Planner MT 2026</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Darker+Grotesque:wght@300..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=21" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Term Planner <span>MT 2026</span><span class="build-badge">v21 TEXT EDITOR</span></div>
    <div class="top-actions">
      <button id="sectionBtn" class="ghost">Jump</button>
      <button id="spreadBtn" class="ghost" title="Toggle single page / facing spread">Spread</button>
      <button id="moreBtn" class="ghost">•••</button>
    </div>
  </header>

  <main id="viewport" class="viewport">
    <div id="pagesHost" class="pages-host"></div>
  </main>

  <nav class="pager" aria-label="Page navigation">
    <button id="prevBtn" aria-label="Previous page">‹</button>
    <label class="page-jump">Page <input id="pageInput" type="number" min="1" max="145" inputmode="numeric" /> / 145</label>
    <button id="nextBtn" aria-label="Next page">›</button>
  </nav>

  <div class="tool-dock" id="toolDock">
    <button data-tool="pen" class="tool active" title="Pen" aria-label="Pen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4.4-1 10.2-10.2-3.4-3.4L5 15.6 4 20Z"/><path d="m13.9 6.7 3.4 3.4"/><path d="M4 20l3.2-3.2"/></svg>
    </button>
    <button data-tool="eraser" class="tool" title="Eraser" aria-label="Eraser">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.2 17.8-4-4a2 2 0 0 1 0-2.8l7.1-7.1a2 2 0 0 1 2.8 0l5.9 5.9a2 2 0 0 1 0 2.8l-5.2 5.2H8.2Z"/><path d="m10 8 6 6"/><path d="M8.2 17.8h11.2"/></svg>
    </button>
    <button data-tool="text" class="tool text-tool" title="Add text" aria-label="Add text"><span class="hand-T">T</span></button>
    <button data-tool="select" class="tool" title="Select / lasso / move" aria-label="Select, lasso or move annotations">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5 18.5 12 12 13.5 9 20.5 5 3.5Z"/><path d="m12 13.5 4.5 5"/></svg>
    </button>
    <button id="undoBtn" class="tool" title="Undo" aria-label="Undo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.5h8.5a5.5 5.5 0 0 1 5.5 5.5"/></svg>
    </button>
    <button id="deleteSelectionBtn" class="tool selection-only" title="Delete selected item" aria-label="Delete selected item" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="m7 7 1 13h8l1-13"/><path d="M10 11v5M14 11v5"/></svg>
    </button>
    <label class="size-control pen-only" title="Pen size"><input id="penSize" type="range" min="1" max="12" value="3" /></label>
    <input id="penColor" type="color" value="#34223f" title="Ink / text colour" />
    <div id="textOptions" class="text-options" hidden>
      <select id="textFont" title="Text font">
        <option value="centaur">Centaur</option>
        <option value="caveat" selected>Caveat</option>
        <option value="darker">Darker Grotesque</option>
      </select>
      <div class="text-row">
        <div class="font-size-control" title="Text size">
          <button id="textSizeDown" type="button" aria-label="Decrease text size">−</button>
          <input id="textSize" type="number" min="6" max="72" step="1" value="12" inputmode="numeric" aria-label="Text size" />
          <button id="textSizeUp" type="button" aria-label="Increase text size">+</button>
        </div>
        <button id="textBold" class="mini-toggle" type="button" title="Bold">B</button>
      </div>
    </div>
  </div>

  <dialog id="sectionDialog">
    <form method="dialog" class="dialog-card">
      <h2>Jump to</h2>
      <div class="jump-grid">
        <button value="1" data-page="1">Cover</button>
        <button value="3" data-page="3">Important info</button>
        <button value="4" data-page="4">Calendar</button>
        <button value="5" data-page="5">Timetable</button>
        <button value="6" data-page="6">August</button>
        <button value="7" data-page="7">September</button>
        <button value="8" data-page="8">October</button>
        <button value="9" data-page="9">November</button>
        <button value="10" data-page="10">December</button>
        <button value="11" data-page="11">To Do</button>
        <button value="15" data-page="15">Weekly planner</button>
      </div>
      <button class="close-btn" value="cancel">Close</button>
    </form>
  </dialog>

  <dialog id="textEditDialog">
    <form method="dialog" class="dialog-card text-editor-card" id="textEditForm">
      <h2>Edit text</h2>
      <textarea id="textEditArea" rows="4" placeholder="Type here"></textarea>
      <div class="text-editor-actions">
        <button value="cancel" class="close-btn" id="textEditCancel">Cancel</button>
        <button value="default" id="textEditSave">Done</button>
      </div>
    </form>
  </dialog>

  <dialog id="moreDialog">
    <div class="dialog-card">
      <h2>Planner data</h2>
      <p class="small">Your handwriting and typed notes are stored on this device.</p>
      <button id="offlineBtn">Make all 145 pages available offline</button>
      <div id="offlineStatus" class="small status"></div>
      <hr />
      <button id="exportBtn">Export annotation backup</button>
      <label class="file-btn">Import annotation backup<input id="importInput" type="file" accept="application/json" /></label>
      <hr />
      <button id="clearPageBtn" class="danger">Clear annotations on current page</button>
      <button id="closeMoreBtn" class="close-btn">Close</button>
    </div>
  </dialog>

  <script src="pages-data.js"></script>
  <script src="app.js?v=21"></script>
</body>
</html>
